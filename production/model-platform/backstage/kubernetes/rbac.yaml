apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-read-only
  namespace: backstage
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-read-only
  namespace: backstage
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-read-only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-read-only
  namespace: crossplane-system
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-read-only
  namespace: crossplane-system
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-read-only
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-read-only
  namespace: model-serving
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["platform.example.com"]
    resources: ["modeldeployments"]
    # Direct operations can patch only the namespaced ModelDeployment CR. They
    # cannot write Pods, Ray objects, Secrets, PVCs, Compositions or manifests.
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["ray.io"]
    resources: ["rayservices", "rayclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-read-only
  namespace: model-serving
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-read-only
---
# Dashboard pipeline status is read-only and scoped to the model configuration
# namespace.  The Backstage service account cannot create or modify Tekton runs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-model-platform-ci-read-only
  namespace: model-platform-ci
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-model-platform-ci-read-only
  namespace: model-platform-ci
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-model-platform-ci-read-only
---
# Argo application state is read-only and is used only to report revision,
# sync and health; Backstage never requests an Argo sync.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-argocd-read-only
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["model-platform-deployment-requests"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-argocd-read-only
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-argocd-read-only
---
# Read-only discovery of the platform-managed K12 release. Run launch goes to
# the allow-listed Dagster GraphQL endpoint and never writes Kubernetes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backstage-k12-data-pipeline-read-only
  namespace: k12
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ray.io"]
    resources: ["rayclusters"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backstage-k12-data-pipeline-read-only
  namespace: k12
subjects:
  - kind: ServiceAccount
    name: backstage
    namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backstage-k12-data-pipeline-read-only
