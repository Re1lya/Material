apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-deployment-cache-reaper
  namespace: model-serving
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-deployment-cache-reaper
  namespace: model-serving
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["jobs", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["ray.io"]
    resources: ["rayservices", "rayclusters"]
    verbs: ["get", "list"]
  - apiGroups: ["platform.example.com"]
    resources: ["modeldeployments"]
    resourceNames: ["qwen38-27b"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-deployment-cache-reaper
  namespace: model-serving
subjects:
  - kind: ServiceAccount
    name: model-deployment-cache-reaper
    namespace: model-serving
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-deployment-cache-reaper
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-deployment-cache-reaper
  namespace: model-serving
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: model-deployment-cache-reaper
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
            kubernetes.io/hostname: server-00
          containers:
            - name: reaper
              image: 110.120.0.3:30670/container-images/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
              command: ["python3", "/opt/reaper/reap_orphan_cache_pods.py"]
              volumeMounts:
                - name: script
                  mountPath: /opt/reaper
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: model-deployment-cache-reaper
