apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-deployment-capacity-checker
  namespace: model-serving
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-deployment-capacity-checker
  namespace: npu-exporter
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/proxy"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-deployment-capacity-checker
  namespace: npu-exporter
subjects:
  - kind: ServiceAccount
    name: model-deployment-capacity-checker
    namespace: model-serving
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-deployment-capacity-checker
---
apiVersion: v1
kind: Service
metadata:
  name: model-deployment-capacity-checker
  namespace: model-serving
spec:
  selector:
    app.kubernetes.io/component: model-deployment-capacity-checker
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-deployment-capacity-checker-egress
  namespace: model-serving
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: model-deployment-capacity-checker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 10.43.0.1/32 }
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock: { cidr: 110.120.0.3/32 }
      ports:
        - { protocol: TCP, port: 6443 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-deployment-capacity-checker
  namespace: model-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: model-deployment-capacity-checker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: model-deployment-capacity-checker
    spec:
      serviceAccountName: model-deployment-capacity-checker
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: server-00
      imagePullSecrets:
        - name: artifact-keeper-image-pull
      containers:
        - name: checker
          image: 110.120.0.3:30670/container-images/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
          command: ["python3", "/opt/checker/capacity_checker.py"]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: script
              mountPath: /opt/checker
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: model-deployment-capacity-checker
        - name: tmp
          emptyDir: {}
