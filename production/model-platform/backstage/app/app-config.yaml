app:
  title: Model Platform
  baseUrl: ${BACKSTAGE_BASE_URL}
  packages: all
  extensions:
    - page:catalog:
        config:
          path: /

organization:
  name: Model Platform

backend:
  baseUrl: ${BACKSTAGE_BASE_URL}
  listen: ':7007'
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # The temporary internal NodePort is HTTP; re-enable this for HTTPS.
    upgrade-insecure-requests: false
  cors:
    origin: ${BACKSTAGE_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder

auth:
  environment: production
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    oidc:
      production:
        metadataUrl: http://110.120.0.3:30081/.well-known/openid-configuration
        clientId: ${GITEA_OIDC_CLIENT_ID}
        clientSecret: ${GITEA_OIDC_CLIENT_SECRET}
        additionalScopes: [openid, profile, email]
        signIn:
          resolvers:
            - resolver: emailMatchingUserEntityProfileEmail
  clientIdMetadataDocuments:
    enabled: false

catalog:
  import:
    entityFilename: catalog-info.yaml
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group, Template]
  locations:
    - type: file
      target: ./catalog/entities.yaml
    - type: file
      target: ./catalog/templates/model-deployment.yaml
    - type: file
      target: ./catalog/templates/model-deployment-start.yaml
    - type: file
      target: ./catalog/templates/model-deployment-stop.yaml

kubernetes:
  frontend:
    podDelete:
      enabled: false
  serviceLocatorMethod:
    type: singleTenant
  objectTypes:
    - configmaps
    - deployments
    - pods
    - services
    - statefulsets
  clusterLocatorMethods:
    - type: config
      clusters:
        - name: production-k3s
          title: Production K3s
          url: https://kubernetes.default.svc
          authProvider: serviceAccount
          skipTLSVerify: false
          skipMetricsLookup: true
          customResources:
            - group: platform.example.com
              apiVersion: v1alpha1
              plural: modeldeployments

permission:
  # The MVP keeps the Scaffolder UI usable even when the browser cannot send
  # a Backstage user credential to /api/permission/authorize. The backend
  # action remains constrained by the allow-listed initiator/model/profile,
  # and Kubernetes RBAC remains the authoritative read-only boundary.
  enabled: false

scaffolder: {}

# This is intentionally not a general SCM integration. The custom action reads
# these fixed values and can only open a constrained ModelDeployment PR.
modelPlatform:
  gitea:
    apiBaseUrl: http://gitea-http.gitea.svc.cluster.local:3000
    owner: gitadmin
    repository: model-platform-config
    baseBranch: main
    token: ${GITEA_REQUEST_TOKEN}
    allowedInitiators:
      - user:default/gitadmin
    allowedModelVersions:
      - qwen3.8-27b-w8a8
    allowedRuntimeProfiles:
      - qwen38-w8a8-ray-ascend-910b3-v1
      - qwen38-w8a8-ray-ascend-910b3-tp2-v1
    artifactKeeperBaseUrl: http://artifact-keeper-backend.artifact-keeper.svc.cluster.local:8080
    stoppedCompositionRef: modeldeployment-control-plane-v1alpha1
  dataPipeline:
    enabled: true
    namespace: k12
    deploymentName: k12-platform-cpu-k12-clean-qa-pipeline-dagster
    rayClusterName: k12-platform-cpu-k12-clean-qa-pipeline-k12-clean-qa
    dagsterBaseUrl: http://k12-platform-cpu-k12-clean-qa-pipeline-dagster.k12.svc.cluster.local:3000
    allowedInitiators:
      - user:default/gitadmin
    jobName: cleanjopbstage1_10
    profileName: k12-stage1-clean-v1
    manifestBucket: k12-cleaned-corpus
    manifestPrefix: cpu-smoke/manifests/
    sourceBucket: k12-mineru-output
    sourcePrefix: full-output/mineru34-hybrid-a3-full-20260722T104600Z
    outputBucket: k12-cleaned-corpus
    outputPrefix: stage1/platform-smoke/
    documentCount: 10
    maxDocumentInflight: 8
    stage1Version: stage1-v1.0.2
    image: 110.120.0.3:30670/container-images/platform/kcc-data-pipeline:0.4.0-cpu-528da6f@sha256:f37687ea197794cbeb471505f193c19adbbb5e29133b245dff6c505dc1756718
    sourceCommit: 528da6fabc41ccd761e6e63eacb59713c662de5e
