    app.kubernetes.io/name: inference-lifecycle-controller
    app.kubernetes.io/part-of: model-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-lifecycle-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-lifecycle-controller
        app.kubernetes.io/part-of: model-platform
    spec:
      serviceAccountName: inference-lifecycle-controller
      automountServiceAccountToken: true
      imagePullSecrets:
        - name: artifact-keeper-platform-pull
      nodeSelector:
        kubernetes.io/arch: amd64
        kubernetes.io/hostname: server-00
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
