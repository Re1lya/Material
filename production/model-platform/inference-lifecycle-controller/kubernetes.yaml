          env:
            - name: WATCH_NAMESPACE
              value: model-serving
            - name: DEPLOYMENT_ALLOWLIST
              value: qwen38-27b
            - name: POLL_SECONDS
              value: "5"
            - name: MISMATCH_GRACE_SECONDS
              value: "30"
            - name: DRY_RUN
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 10
---
