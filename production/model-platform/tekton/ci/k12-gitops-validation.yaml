apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: validate-k12-gitops-release
  namespace: model-platform-ci
  labels:
    app.kubernetes.io/part-of: model-platform
    app.kubernetes.io/component: k12-data-pipeline-ci
spec:
  description: >-
    Validate one exact gitadmin/model-platform-config commit whose diff is the
    scoped K12 data-pipeline CPU release directory. Renders kustomize objects,
    enforces the 8-object allowlist, the single approved compatibility
    NodePort, digest-pinned images and NPU/host/RBAC deny-lists, then reports
    tekton/k12-gitops-release back to Gitea.
  params:
    - name: repository-url
      type: string
    - name: revision
      type: string
  workspaces:
    - name: source
  tasks:
    - name: validate-k12-gitops
      params:
        - name: repository-url
          value: $(params.repository-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: repository-url
            type: string
          - name: revision
            type: string
        workspaces:
          - name: source
        steps:
          - name: clone
            image: 110.120.0.3:30670/container-images/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
            imagePullPolicy: IfNotPresent
            workingDir: $(workspaces.source.path)
            env:
              - name: REPOSITORY_URL
                value: $(params.repository-url)
              - name: REVISION
                value: $(params.revision)
              - name: GITEA_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: gitea-ci-reader
                    key: username
              - name: GITEA_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: gitea-ci-reader
                    key: token
            script: |
              #!/bin/sh
              set -eu
              test "${REPOSITORY_URL}" = \
                'http://gitea-http.gitea.svc.cluster.local:3000/gitadmin/model-platform-config.git'
              case "${REVISION}" in
                *[!0-9a-f]*|'') exit 1 ;;
              esac
              test "${#REVISION}" -eq 40
              test "${#GITEA_TOKEN}" -ge 20

              askpass="$(workspaces.source.path)/git-askpass.sh"
              checkout="$(workspaces.source.path)/repository"
              rm -rf "${checkout}"
              cat > "${askpass}" <<'EOF'
              #!/bin/sh
              case "$1" in
                *Username*) printf '%s' "$GITEA_USERNAME" ;;
                *Password*) printf '%s' "$GITEA_TOKEN" ;;
                *) exit 1 ;;
              esac
              EOF
              chmod 0700 "${askpass}"
              export GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0
              git clone --no-checkout "${REPOSITORY_URL}" "${checkout}"
              git -C "${checkout}" checkout --detach "${REVISION}"
              rm -f "${askpass}"
              test "$(git -C "${checkout}" rev-parse HEAD)" = "${REVISION}"
              test -d "${checkout}/environments/production/k12-data-pipeline"
              echo 'k12_gitops_clone=PASS'
            computeResources:
              requests: {cpu: 100m, memory: 128Mi}
              limits: {cpu: 500m, memory: 512Mi}
            securityContext: &restricted
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile: {type: RuntimeDefault}

          - name: render-and-policy
            image: 110.120.0.3:30670/container-images/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
            imagePullPolicy: IfNotPresent
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -eu
              rendered="$(workspaces.source.path)/k12-cpu-rendered.yaml"
              kubectl kustomize \
                repository/environments/production/k12-data-pipeline > "${rendered}"
              test -s "${rendered}"
              python3 - "${rendered}" <<'PY'
              import re
              import sys

              path = sys.argv[1]
              with open(path) as handle:
                  text = handle.read()

              documents = [
                  document
                  for document in re.split(r"^---\s*$", text, flags=re.M)
                  if document.strip()
              ]
              print(f"rendered_object_count={len(documents)}")
              if len(documents) != 8:
                  raise SystemExit(
                      f"expected exactly 8 objects, got {len(documents)}"
                  )

              kind_names = re.findall(r"^kind:\s*(\S+)\s*$", text, flags=re.M)
              expected = sorted(
                  [
                      "ServiceAccount",
                      "ConfigMap",
                      "Service",
                      "Service",
                      "Deployment",
                      "RayCluster",
                      "NetworkPolicy",
                      "NetworkPolicy",
                  ]
              )
              actual = sorted(kind_names)
              if actual != expected:
                  raise SystemExit(
                      f"kinds mismatch: actual={actual} expected={expected}"
                  )
              print(f"k12_gitops_kinds=PASS count={len(actual)}")

              pinned = (
                  "@sha256:f37687ea197794cbeb471505f193c19adbbb5e29133b245dff6c505dc1756718"
              )
              images = re.findall(r"^\s*image:\s*(\S+)\s*$", text, flags=re.M)
              untrusted = [
                  image for image in images if not image.endswith(pinned)
              ]
              if untrusted or not images:
                  raise SystemExit(
                      f"images not digest-pinned: allowed={pinned} "
                      f"offending={untrusted} total={len(images)}"
                  )
              print(f"k12_gitops_image_digest=PASS images={len(images)}")

              compatibility = [
                  document
                  for document in documents
                  if re.search(r"^kind:\s*Service\s*$", document, flags=re.M)
                  and re.search(
                      r"^\s*name:\s*mineru-dagster\s*$",
                      document,
                      flags=re.M,
                  )
              ]
              node_ports = re.findall(
                  r"^\s*nodePort:\s*(\d+)\s*$", text, flags=re.M
              )
              if len(compatibility) != 1 or node_ports != ["30080"]:
                  raise SystemExit(
                      "invalid compatibility Service: "
                      f"documents={len(compatibility)} nodePorts={node_ports}"
                  )
              required_compatibility_fields = [
                  "type: NodePort",
                  "app.kubernetes.io/name: k12-clean-qa-pipeline",
                  "app.kubernetes.io/instance: k12-platform-cpu",
                  "app.kubernetes.io/component: dagster",
                  "model-platform.io/compatibility-endpoint: \"true\"",
              ]
              missing = [
                  token
                  for token in required_compatibility_fields
                  if token not in compatibility[0]
              ]
              if missing:
                  raise SystemExit(
                      f"compatibility Service fields missing: {missing}"
                  )
              print("k12_gitops_compatibility_service=PASS")

              forbidden = [
                  "huawei.com/Ascend",
                  "hostPath:",
                  "privileged: true",
                  "kind: Secret",
                  "kind: PersistentVolume",
                  "kind: Role",
                  "kind: RoleBinding",
                  "qwen-worker",
                  "mineru-worker",
              ]
              hits = [token for token in forbidden if token in text]
              if hits:
                  raise SystemExit(f"forbidden pattern present: {hits}")
              print("k12_gitops_forbidden_scan=PASS")
              PY
              echo 'k12_gitops_render_policy=PASS'
            computeResources:
              requests: {cpu: 100m, memory: 128Mi}
              limits: {cpu: 500m, memory: 512Mi}
            securityContext: *restricted
  finally:
    - name: report-k12-gitops-status
      params:
        - name: revision
          value: $(params.revision)
        - name: aggregate-status
          value: $(tasks.status)
      taskSpec:
        params:
          - name: revision
            type: string
          - name: aggregate-status
            type: string
        steps:
          - name: report
            image: 110.120.0.3:30670/container-images/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
            env:
              - name: REVISION
                value: $(params.revision)
              - name: AGGREGATE_STATUS
                value: $(params.aggregate-status)
              - name: GITEA_STATUS_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: gitea-ci-status-writer
                    key: token
            script: |
              #!/usr/bin/env python3
              import json
              import os
              import urllib.error
              import urllib.request

              revision = os.environ["REVISION"]
              aggregate = os.environ["AGGREGATE_STATUS"]
              if len(revision) != 40 or any(ch not in "0123456789abcdef" for ch in revision):
                  raise SystemExit("malformed revision")
              state = "success" if aggregate == "Succeeded" else "failure"
              request = urllib.request.Request(
                  f"http://gitea-http.gitea.svc.cluster.local:3000/api/v1/repos/gitadmin/model-platform-config/statuses/{revision}",
                  method="POST",
                  data=json.dumps(
                      {
                          "state": state,
                          "context": "tekton/k12-gitops-release",
                          "description": f"K12 GitOps release validation: {aggregate}",
                          "target_url": f"http://110.120.0.3:30081/gitadmin/model-platform-config/commit/{revision}",
                      }
                  ).encode(),
                  headers={
                      "Authorization": f"token {os.environ['GITEA_STATUS_TOKEN']}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if response.status != 201:
                          raise SystemExit(f"Gitea returned HTTP {response.status}")
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"Gitea returned HTTP {error.code}") from None
              print(f"gitea_commit_status={state}")
            computeResources:
              requests: {cpu: 100m, memory: 128Mi}
              limits: {cpu: 500m, memory: 512Mi}
            securityContext: *restricted
