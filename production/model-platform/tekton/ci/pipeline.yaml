apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: validate-model-platform-config
  namespace: model-platform-ci
  labels:
    app.kubernetes.io/part-of: model-platform
    app.kubernetes.io/component: ci
spec:
  description: Clone one trusted Gitea or GitHub commit and validate the constrained GitOps path.
  params:
    - name: repository-url
      type: string
    - name: revision
      type: string
    - name: source-provider
      type: string
    - name: source-root
      type: string
    - name: clone-credentials-secret
      type: string
  workspaces:
    - name: source
  tasks:
    - name: clone-and-validate
      params:
        - name: repository-url
          value: $(params.repository-url)
        - name: revision
          value: $(params.revision)
        - name: source-provider
          value: $(params.source-provider)
        - name: source-root
          value: $(params.source-root)
        - name: clone-credentials-secret
          value: $(params.clone-credentials-secret)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: repository-url
            type: string
          - name: revision
            type: string
          - name: source-provider
            type: string
          - name: source-root
            type: string
          - name: clone-credentials-secret
            type: string
        workspaces:
          - name: source
        steps:
          - name: validate
            image: 110.120.0.3:8889/platform/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
            imagePullPolicy: IfNotPresent
            workingDir: $(workspaces.source.path)
            env:
              - name: REPOSITORY_URL
                value: $(params.repository-url)
              - name: REVISION
                value: $(params.revision)
              - name: SOURCE_PROVIDER
                value: $(params.source-provider)
              - name: SOURCE_ROOT
                value: $(params.source-root)
              - name: GITEA_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: $(params.clone-credentials-secret)
                    key: username
                    optional: true
              - name: GITEA_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.clone-credentials-secret)
                    key: token
                    optional: true
            computeResources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            script: |
              #!/bin/sh
              set -eu

              case "${SOURCE_PROVIDER}:${REPOSITORY_URL}:${SOURCE_ROOT}" in
                'gitea:http://gitea-http.gitea.svc.cluster.local:3000/gitadmin/model-platform-config.git:.')
                  use_gitea_credentials=true
                  ;;
                'github:https://github.com/Re1lya/Material.git:production/model-platform/gitops/repository')
                  use_gitea_credentials=false
                  ;;
                *)
                  echo 'repository source is outside the CI trust boundary' >&2
                  exit 1
                  ;;
              esac

              case "${REVISION}" in
                *[!0-9a-f]*|'')
                  echo 'revision must be a lowercase hexadecimal commit ID' >&2
                  exit 1
                  ;;
              esac
              if [ "${#REVISION}" -ne 40 ]; then
                echo 'revision must be a complete 40-character Git commit ID' >&2
                exit 1
              fi

              askpass="$(workspaces.source.path)/git-askpass.sh"
              checkout="$(workspaces.source.path)/repository"
              rm -rf "${checkout}"
              if [ "${use_gitea_credentials}" = true ]; then
                if [ "${#GITEA_TOKEN}" -lt 20 ]; then
                  echo 'Gitea token is missing or too short' >&2
                  exit 1
                fi
                cat > "${askpass}" <<'EOF'
              #!/bin/sh
              case "$1" in
                *Username*) printf '%s' "$GITEA_USERNAME" ;;
                *Password*) printf '%s' "$GITEA_TOKEN" ;;
                *) exit 1 ;;
              esac
              EOF
                chmod 0700 "${askpass}"
                export GIT_ASKPASS="${askpass}"
              else
                unset GIT_ASKPASS
              fi
              export GIT_TERMINAL_PROMPT=0

              git clone --no-checkout "${REPOSITORY_URL}" "${checkout}"
              git -C "${checkout}" checkout --detach "${REVISION}"
              rm -f "${askpass}"

              actual_revision="$(git -C "${checkout}" rev-parse HEAD)"
              if [ "${actual_revision}" != "${REVISION}" ]; then
                echo 'checked out revision does not match webhook revision' >&2
                exit 1
              fi

              source_root="${checkout}/${SOURCE_ROOT}"
              if [ ! -d "${source_root}" ]; then
                echo 'expected source root is missing from the checked-out commit' >&2
                exit 1
              fi

              rendered_file="$(mktemp)"
              trap 'rm -f "${rendered_file}"' EXIT
              kubectl kustomize \
                "${source_root}/environments/production/bootstrap" \
                > "${rendered_file}"

              kind_count="$(grep -c '^kind:' "${rendered_file}")"
              if [ "${kind_count}" -ne 1 ]; then
                echo "expected exactly one rendered object, found ${kind_count}" >&2
                exit 1
              fi

              grep -qx 'kind: ConfigMap' "${rendered_file}"
              grep -qx '  name: gitops-bootstrap-status' "${rendered_file}"
              grep -qx '  namespace: model-platform-system' "${rendered_file}"
              echo 'bootstrap_validation=PASS'
              sha256sum "${rendered_file}"
          - name: validate-catalog
            image: 110.120.0.3:8889/platform/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
            imagePullPolicy: IfNotPresent
            workingDir: $(workspaces.source.path)/repository
            env:
              - name: SOURCE_ROOT
                value: $(params.source-root)
            script: |
              #!/bin/sh
              set -eu
              cd "${SOURCE_ROOT}"
              python3 ./ci/validate-catalog.py \
                --catalog-dir ./environments/production/catalog \
                --schema-dir ./ci/schema
            computeResources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
