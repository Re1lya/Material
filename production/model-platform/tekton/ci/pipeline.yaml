apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: validate-model-platform-config
  namespace: model-platform-ci
  labels:
    app.kubernetes.io/part-of: model-platform
    app.kubernetes.io/component: ci
spec:
  description: Clone one trusted Gitea or GitHub commit and validate the constrained GitOps path.
  params:
    - name: repository-url
      type: string
    - name: revision
      type: string
    - name: source-provider
      type: string
    - name: source-root
      type: string
    - name: clone-credentials-secret
      type: string
    - name: event-kind
      type: string
      default: manual
    - name: pull-request-number
      type: string
      default: "0"
  workspaces:
    - name: source
  tasks:
    - name: clone-and-validate
      params:
        - name: repository-url
          value: $(params.repository-url)
        - name: revision
          value: $(params.revision)
        - name: source-provider
          value: $(params.source-provider)
        - name: source-root
          value: $(params.source-root)
        - name: clone-credentials-secret
          value: $(params.clone-credentials-secret)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: repository-url
            type: string
          - name: revision
            type: string
          - name: source-provider
            type: string
          - name: source-root
            type: string
          - name: clone-credentials-secret
            type: string
        workspaces:
          - name: source
        steps:
          - name: validate
            image: 110.120.0.3:30670/container-images/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
            imagePullPolicy: IfNotPresent
            workingDir: $(workspaces.source.path)
            env:
              - name: REPOSITORY_URL
                value: $(params.repository-url)
              - name: REVISION
                value: $(params.revision)
              - name: SOURCE_PROVIDER
                value: $(params.source-provider)
              - name: SOURCE_ROOT
                value: $(params.source-root)
              - name: GITEA_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: $(params.clone-credentials-secret)
                    key: username
                    optional: true
              - name: GITEA_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: $(params.clone-credentials-secret)
                    key: token
                    optional: true
            computeResources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
            script: |
              #!/bin/sh
              set -eu

              case "${SOURCE_PROVIDER}:${REPOSITORY_URL}:${SOURCE_ROOT}" in
                'gitea:http://gitea-http.gitea.svc.cluster.local:3000/gitadmin/model-platform-config.git:.')
                  use_gitea_credentials=true
                  ;;
                'github:https://github.com/Re1lya/Material.git:production/model-platform/gitops/repository')
                  use_gitea_credentials=false
                  ;;
                *)
                  echo 'repository source is outside the CI trust boundary' >&2
                  exit 1
                  ;;
              esac

              case "${REVISION}" in
                *[!0-9a-f]*|'')
                  echo 'revision must be a lowercase hexadecimal commit ID' >&2
                  exit 1
                  ;;
              esac
              if [ "${#REVISION}" -ne 40 ]; then
                echo 'revision must be a complete 40-character Git commit ID' >&2
                exit 1
              fi

              askpass="$(workspaces.source.path)/git-askpass.sh"
              checkout="$(workspaces.source.path)/repository"
              rm -rf "${checkout}"
              if [ "${use_gitea_credentials}" = true ]; then
                if [ "${#GITEA_TOKEN}" -lt 20 ]; then
                  echo 'Gitea token is missing or too short' >&2
                  exit 1
                fi
                cat > "${askpass}" <<'EOF'
              #!/bin/sh
              case "$1" in
                *Username*) printf '%s' "$GITEA_USERNAME" ;;
                *Password*) printf '%s' "$GITEA_TOKEN" ;;
                *) exit 1 ;;
              esac
              EOF
                chmod 0700 "${askpass}"
                export GIT_ASKPASS="${askpass}"
              else
                unset GIT_ASKPASS
              fi
              export GIT_TERMINAL_PROMPT=0

              git clone --no-checkout "${REPOSITORY_URL}" "${checkout}"
              git -C "${checkout}" checkout --detach "${REVISION}"
              rm -f "${askpass}"

              actual_revision="$(git -C "${checkout}" rev-parse HEAD)"
              if [ "${actual_revision}" != "${REVISION}" ]; then
                echo 'checked out revision does not match webhook revision' >&2
                exit 1
              fi

              source_root="${checkout}/${SOURCE_ROOT}"
              if [ ! -d "${source_root}" ]; then
                echo 'expected source root is missing from the checked-out commit' >&2
                exit 1
              fi

              rendered_file="$(mktemp)"
              trap 'rm -f "${rendered_file}"' EXIT
              kubectl kustomize \
                "${source_root}/environments/production/bootstrap" \
                > "${rendered_file}"

              kind_count="$(grep -c '^kind:' "${rendered_file}")"
              if [ "${kind_count}" -ne 1 ]; then
                echo "expected exactly one rendered object, found ${kind_count}" >&2
                exit 1
              fi

              grep -qx 'kind: ConfigMap' "${rendered_file}"
              grep -qx '  name: gitops-bootstrap-status' "${rendered_file}"
              grep -qx '  namespace: model-platform-system' "${rendered_file}"
              echo 'bootstrap_validation=PASS'
              sha256sum "${rendered_file}"
          - name: validate-catalog
            image: 110.120.0.3:30670/container-images/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
            imagePullPolicy: IfNotPresent
            workingDir: $(workspaces.source.path)/repository
            env:
              - name: SOURCE_ROOT
                value: $(params.source-root)
            script: |
              #!/bin/sh
              set -eu
              cd "${SOURCE_ROOT}"
              python3 ./ci/validate-catalog.py \
                --catalog-dir ./environments/production/catalog \
                --schema-dir ./ci/schema
            computeResources:
              requests:
                cpu: 250m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
          - name: validate-modeldeployments
            image: 110.120.0.3:30670/container-images/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
            imagePullPolicy: IfNotPresent
            workingDir: $(workspaces.source.path)/repository
            env:
              - name: SOURCE_ROOT
                value: $(params.source-root)
            script: |
              #!/bin/sh
              set -eu
              cd "${SOURCE_ROOT}"
              python3 ./ci/validate-modeldeployments.py \
                --requests-dir ./environments/production/modeldeployments \
                --catalog-dir ./environments/production/catalog \
                --schema ./ci/schema/modeldeployment.schema.json
            computeResources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
    - name: auto-merge-stopped-request
      runAfter:
        - clone-and-validate
      when:
        - input: $(params.source-provider)
          operator: in
          values:
            - gitea
        - input: $(params.event-kind)
          operator: in
          values:
            - pull-request
      params:
        - name: revision
          value: $(params.revision)
        - name: pull-request-number
          value: $(params.pull-request-number)
        - name: source-root
          value: $(params.source-root)
      workspaces:
        - name: source
          workspace: source
      taskSpec:
        params:
          - name: revision
            type: string
          - name: pull-request-number
            type: string
          - name: source-root
            type: string
        workspaces:
          - name: source
        steps:
          - name: merge
            image: 110.120.0.3:30670/container-images/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
            imagePullPolicy: IfNotPresent
            workingDir: $(workspaces.source.path)/repository
            env:
              - name: REVISION
                value: $(params.revision)
              - name: PULL_REQUEST_NUMBER
                value: $(params.pull-request-number)
              - name: SOURCE_ROOT
                value: $(params.source-root)
              - name: GITEA_MERGE_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: gitea-model-deployment-merger
                    key: token
            script: |
              #!/usr/bin/env python3
              import json
              import os
              from pathlib import Path
              import re
              import urllib.error
              import urllib.request

              from ruamel.yaml import YAML

              api = "http://gitea-http.gitea.svc.cluster.local:3000/api/v1"
              repository = "/repos/gitadmin/model-platform-config"
              revision = os.environ["REVISION"]
              pull_number = os.environ["PULL_REQUEST_NUMBER"]
              token = os.environ["GITEA_MERGE_TOKEN"]

              if len(revision) != 40 or any(ch not in "0123456789abcdef" for ch in revision):
                  raise SystemExit("refusing to merge a malformed revision")
              if not pull_number.isdigit() or int(pull_number) < 1:
                  raise SystemExit("pull-request-number must be a positive integer")
              if len(token) < 20:
                  raise SystemExit("merge token is missing or too short")

              def call(method, path, body=None, accepted=(200,)):
                  data = None if body is None else json.dumps(body).encode("utf-8")
                  request = urllib.request.Request(
                      api + path,
                      data=data,
                      method=method,
                      headers={
                          "Accept": "application/json",
                          "Authorization": f"token {token}",
                          **({} if data is None else {"Content-Type": "application/json"}),
                      },
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          raw = response.read()
                          status = response.status
                  except urllib.error.HTTPError as error:
                      raise SystemExit(
                          f"Gitea {method} {path} returned HTTP {error.code}"
                      ) from None
                  if status not in accepted:
                      raise SystemExit(f"Gitea {method} {path} returned HTTP {status}")
                  return None if not raw else json.loads(raw)

              pull = call("GET", f"{repository}/pulls/{pull_number}")
              if pull.get("state") != "open":
                  raise SystemExit("pull request is not open")
              if pull.get("base", {}).get("ref") != "main":
                  raise SystemExit("pull request base must be main")
              if pull.get("head", {}).get("sha") != revision:
                  raise SystemExit("pull request head differs from the validated revision")
              if pull.get("head", {}).get("repo", {}).get("full_name") != "gitadmin/model-platform-config":
                  raise SystemExit("pull request head repository is outside the trust boundary")
              if not str(pull.get("head", {}).get("ref", "")).startswith(
                  "backstage/modeldeployment-"
              ):
                  raise SystemExit("pull request branch was not generated by Backstage")

              files = call("GET", f"{repository}/pulls/{pull_number}/files")
              if len(files) != 1:
                  raise SystemExit("auto-merge requires exactly one changed file")
              changed = files[0]
              filename = changed.get("filename", "")
              if changed.get("status") != "added":
                  raise SystemExit("auto-merge only accepts a newly added request file")
              if not re.fullmatch(
                  r"environments/production/modeldeployments/[a-z0-9](?:[-a-z0-9]*[a-z0-9])?\.yaml",
                  filename,
              ):
                  raise SystemExit("changed path is outside the ModelDeployment request directory")

              source_root = Path(os.environ["SOURCE_ROOT"])
              request_file = source_root / filename
              document = YAML(typ="safe").load(request_file.read_text(encoding="utf-8"))
              spec = document.get("spec", {})
              annotations = document.get("metadata", {}).get("annotations", {})
              runtime = spec.get("runtime", {})
              if spec.get("desiredState") != "Stopped" or runtime.get("workerReplicas") != 0:
                  raise SystemExit("auto-merge only accepts Stopped requests with workerReplicas=0")
              if annotations.get("platform.example.com/request-mode") != "declarative-stopped":
                  raise SystemExit("request-mode must be declarative-stopped")
              if any(
                  annotations.get(key) != "0"
                  for key in (
                      "platform.example.com/effective-tensor-parallel-size",
                      "platform.example.com/effective-replicas",
                      "platform.example.com/effective-npu-per-replica",
                  )
              ):
                  raise SystemExit("effective runtime annotations must remain zero")
              if "crossplane.io/paused" in annotations:
                  raise SystemExit("auto-merge requests must not carry the pause annotation")

              call(
                  "POST",
                  f"{repository}/pulls/{pull_number}/merge",
                  {
                      "Do": "merge",
                      "head_commit_id": revision,
                      "delete_branch_after_merge": True,
                      "force_merge": False,
                  },
              )
              print(f"auto_merged_pull_request={pull_number}")
            computeResources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
  finally:
    - name: report-gitea-commit-status
      when:
        - input: $(params.source-provider)
          operator: in
          values:
            - gitea
      params:
        - name: revision
          value: $(params.revision)
        - name: aggregate-status
          value: $(tasks.status)
      taskSpec:
        params:
          - name: revision
            type: string
          - name: aggregate-status
            type: string
        steps:
          - name: report
            image: 110.120.0.3:30670/container-images/model-platform-ci-tools:v0.2.0@sha256:e83607f17953aa25e94b3f3f071eae057f67adc77f600f0a492741c8fd58a7bd
            imagePullPolicy: IfNotPresent
            env:
              - name: REVISION
                value: $(params.revision)
              - name: AGGREGATE_STATUS
                value: $(params.aggregate-status)
              - name: GITEA_STATUS_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: gitea-ci-status-writer
                    key: token
            script: |
              #!/usr/bin/env python3
              import json
              import os
              import urllib.error
              import urllib.request

              aggregate = os.environ["AGGREGATE_STATUS"]
              state = "success" if aggregate == "Succeeded" else "failure"
              description = (
                  "Model platform policy validation passed"
                  if state == "success"
                  else f"Model platform policy validation did not pass ({aggregate})"
              )
              revision = os.environ["REVISION"]
              if len(revision) != 40 or any(ch not in "0123456789abcdef" for ch in revision):
                  raise SystemExit("refusing to report a malformed revision")

              request = urllib.request.Request(
                  "http://gitea-http.gitea.svc.cluster.local:3000/"
                  f"api/v1/repos/gitadmin/model-platform-config/statuses/{revision}",
                  method="POST",
                  data=json.dumps(
                       {
                           "state": state,
                           "context": "tekton/model-platform-policy",
                           "description": description,
                           "target_url": (
                               "http://110.120.0.3:30081/"
                               "gitadmin/model-platform-config/commit/"
                               + revision
                           ),
                       }
                  ).encode("utf-8"),
                  headers={
                      "Accept": "application/json",
                      "Authorization": f"token {os.environ['GITEA_STATUS_TOKEN']}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      if response.status != 201:
                          raise SystemExit(
                              f"Gitea commit status returned HTTP {response.status}"
                          )
              except urllib.error.HTTPError as error:
                  # Never print the response body; it can echo sensitive input.
                  raise SystemExit(
                      f"Gitea commit status returned HTTP {error.code}"
                  ) from None

              print(f"gitea_commit_status={state}")
            computeResources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              runAsNonRoot: true
              runAsUser: 65532
              runAsGroup: 65532
              seccompProfile:
                type: RuntimeDefault
