apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: model-platform-config-push
  namespace: model-platform-ci
spec:
  params:
    - name: git-revision
      value: $(body.after)
    - name: repository-url
      value: http://gitea-http.gitea.svc.cluster.local:3000/gitadmin/model-platform-config.git
    - name: source-provider
      value: gitea
    - name: source-root
      value: .
    - name: event-kind
      value: push
    - name: clone-credentials-secret
      value: gitea-ci-reader
    - name: pull-request-number
      value: "0"
    - name: pull-request-head-ref
      value: ""
---
apiVersion: triggers.tekton.dev/v1beta1
