apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: model-platform-config-validation
  namespace: model-platform-ci
spec:
  params:
    - name: git-revision
    - name: repository-url
    - name: source-provider
    - name: source-root
    - name: event-kind
    - name: clone-credentials-secret
    - name: pull-request-number
    - name: pull-request-head-ref
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: model-platform-config-validation-
        namespace: model-platform-ci
        labels:
          app.kubernetes.io/part-of: model-platform
          app.kubernetes.io/component: ci
          ci.model-platform.io/source: $(tt.params.source-provider)
          ci.model-platform.io/event: $(tt.params.event-kind)
      spec:
        pipelineRef:
          name: validate-model-platform-config
        params:
          - name: repository-url
            value: $(tt.params.repository-url)
          - name: revision
            value: $(tt.params.git-revision)
          - name: source-provider
            value: $(tt.params.source-provider)
          - name: source-root
            value: $(tt.params.source-root)
          - name: clone-credentials-secret
            value: $(tt.params.clone-credentials-secret)
          - name: event-kind
            value: $(tt.params.event-kind)
          - name: pull-request-number
            value: $(tt.params.pull-request-number)
          - name: pull-request-head-ref
            value: $(tt.params.pull-request-head-ref)
        taskRunTemplate:
          serviceAccountName: model-platform-ci-runner
          podTemplate:
            imagePullSecrets:
              - name: artifact-keeper-image-pull
            nodeSelector:
              kubernetes.io/arch: amd64
              kubernetes.io/hostname: server-00
            securityContext:
              fsGroup: 65532
              fsGroupChangePolicy: OnRootMismatch
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
        taskRunSpecs:
          - pipelineTaskName: capacity-gate-running
            serviceAccountName: model-capacity-reader
          - pipelineTaskName: reclaim-retained-cache-pv
            serviceAccountName: model-cache-reclaimer
        timeouts:
          pipeline: 10m
        workspaces:
          - name: source
            emptyDir:
              sizeLimit: 512Mi
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: model-platform-config
  namespace: model-platform-ci
spec:
  serviceAccountName: model-platform-ci-listener
  resources:
    kubernetesResource:
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/arch: amd64
              kubernetes.io/hostname: server-00
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
  triggers:
    - name: validate-main-push
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                header.match('X-Gitea-Event', 'push') &&
                body.ref == 'refs/heads/main' &&
                body.repository.full_name == 'gitadmin/model-platform-config'
      bindings:
        - ref: model-platform-config-push
      template:
        ref: model-platform-config-validation
    - name: validate-pull-request
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                (header.match('X-Gitea-Event', 'pull_request') ||
                 header.match('X-Gitea-Event', 'pull_request_sync')) &&
                body.action in ['opened', 'reopened', 'synchronized'] &&
                body.repository.full_name == 'gitadmin/model-platform-config' &&
                body.pull_request.base.ref == 'main' &&
                body.pull_request.head.repo.full_name == 'gitadmin/model-platform-config'
      bindings:
        - ref: model-platform-config-pull-request
      template:
        ref: model-platform-config-validation
    - name: validate-platform-backstage-pull-request
      interceptors:
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                (header.match('X-Gitea-Event', 'pull_request') ||
                 header.match('X-Gitea-Event', 'pull_request_sync')) &&
                body.action in ['opened', 'reopened', 'synchronized'] &&
                body.repository.full_name == 'gitadmin/platform-backstage' &&
                body.pull_request.base.ref == 'main' &&
                body.pull_request.head.repo.full_name == 'gitadmin/platform-backstage' &&
                body.pull_request.head.sha.matches('^[0-9a-f]{40}$')
      bindings:
        - ref: platform-backstage-pull-request
      template:
        ref: platform-backstage-pr-validation
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: model-platform-github
  namespace: model-platform-ci
spec:
  serviceAccountName: model-platform-ci-listener
  resources:
    kubernetesResource:
      spec:
        template:
          spec:
            nodeSelector:
              kubernetes.io/arch: amd64
              kubernetes.io/hostname: server-00
            securityContext:
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            containers:
              - resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
  triggers:
    - name: validate-github-main-push
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
            apiVersion: triggers.tekton.dev
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value:
                - push
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.ref == 'refs/heads/main' &&
                body.repository.full_name == 'Re1lya/Material'
      bindings:
        - ref: model-platform-config-github-push
      template:
        ref: model-platform-config-validation
    - name: validate-github-main-pull-request
      interceptors:
        - ref:
            name: github
            kind: ClusterInterceptor
            apiVersion: triggers.tekton.dev
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secretToken
            - name: eventTypes
              value:
                - pull_request
        - ref:
            name: cel
          params:
            - name: filter
              value: >-
                body.action in ['opened', 'reopened', 'synchronize'] &&
                body.repository.full_name == 'Re1lya/Material' &&
                body.pull_request.base.ref == 'main' &&
                body.pull_request.head.repo.full_name == 'Re1lya/Material'
      bindings:
        - ref: model-platform-config-github-pull-request
      template:
        ref: model-platform-config-validation
