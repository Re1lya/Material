    - name: source-provider
      value: gitea
    - name: source-root
      value: .
    - name: event-kind
      value: pull-request
    - name: clone-credentials-secret
      value: gitea-ci-reader
    - name: pull-request-number
      value: $(body.pull_request.number)
    - name: pull-request-head-ref
      value: $(body.pull_request.head.ref)
---
