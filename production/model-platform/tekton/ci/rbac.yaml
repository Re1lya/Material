apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-platform-ci-runner
  namespace: model-platform-ci
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-platform-ci-listener
  namespace: model-platform-ci
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-platform-ci-listener
  namespace: model-platform-ci
rules:
  - apiGroups:
      - triggers.tekton.dev
    resources:
      - eventlisteners
      - interceptors
      - triggerbindings
      - triggertemplates
      - triggers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - tekton.dev
    resources:
      - pipelineruns
    verbs:
      - create
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    resourceNames:
      - model-platform-ci-runner
    verbs:
      - impersonate
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-platform-ci-listener
  namespace: model-platform-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-platform-ci-listener
subjects:
  - kind: ServiceAccount
    name: model-platform-ci-listener
    namespace: model-platform-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: model-platform-ci-listener-cluster-read
rules:
  - apiGroups:
      - triggers.tekton.dev
    resources:
      - clustertriggerbindings
      - clusterinterceptors
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: model-platform-ci-listener-cluster-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: model-platform-ci-listener-cluster-read
subjects:
  - kind: ServiceAccount
    name: model-platform-ci-listener
    namespace: model-platform-ci
