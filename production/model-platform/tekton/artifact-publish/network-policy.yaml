apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artifact-publish-default-deny
  namespace: artifact-publish
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artifact-publish-allow-control-and-artifact-keeper
  namespace: artifact-publish
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: artifact-keeper
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.42.0.0/16
      ports:
        - protocol: TCP
          port: 443
    # K3s service CIDR: the in-cluster Kubernetes API and the Tekton CEL
    # interceptor are reached through ClusterIP Services rather than Pod IPs.
    - to:
        - ipBlock:
            cidr: 10.43.0.0/16
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: artifact-publish-allow-backstage-eventlistener
  namespace: artifact-publish
spec:
  podSelector:
    matchLabels:
      eventlistener: artifact-publish
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: backstage
      ports:
        - protocol: TCP
          port: 8080
