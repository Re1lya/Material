# Argo CD 3.4.5 / argo-cd Helm chart 10.1.4.
# This bootstrap release deliberately creates no Application or AppProject.
crds:
  install: true
  keep: true

global:
  image:
    repository: 110.120.0.3:8889/platform/argocd
    tag: v3.4.5@sha256:bd9ef458249f5d7778d906a4d77bcfa61b85d69a0efc8e802cd02f35eb63dede
    imagePullPolicy: IfNotPresent
  logging:
    format: json
    level: info
  networkPolicy:
    create: false
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
    kubernetes.io/hostname: server-00
  affinity:
    podAntiAffinity: none
    nodeAffinity:
      type: none
      matchExpressions: []

configs:
  cm:
    admin.enabled: true
    exec.enabled: false
    statusbadge.enabled: false
  params:
    server.insecure: false
  rbac:
    policy.default: ""

controller:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      additionalLabels:
        otelcol: prometheus-otelcol

server:
  replicas: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
  ingress:
    enabled: false
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      additionalLabels:
        otelcol: prometheus-otelcol

repoServer:
  replicas: 1
  autoscaling:
    enabled: false
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  copyutil:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  emptyDir:
    sizeLimit: 2Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      additionalLabels:
        otelcol: prometheus-otelcol

redis:
  enabled: true
  image:
    repository: 110.120.0.3:8889/library/redis
    tag: 8.2.3-alpine@sha256:e499175dfb27569cd40010c2eee346113db95fdd0efc88ab9fd70a9e807f4542
    imagePullPolicy: IfNotPresent
  exporter:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

redisSecretInit:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

redis-ha:
  enabled: false

dex:
  enabled: false

# Chart 10.1.4 always renders this Deployment. Zero replicas keeps the
# compatible object and CRDs without starting another controller Pod.
applicationSet:
  replicas: 0
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

notifications:
  enabled: false

commitServer:
  enabled: false
