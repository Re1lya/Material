apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-kubernetes
  namespace: crossplane-system
  labels:
    app.kubernetes.io/part-of: model-platform
    app.kubernetes.io/component: provider-kubernetes
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: model-serving-provider-kubernetes
  namespace: model-serving
  labels:
    app.kubernetes.io/part-of: model-platform
    app.kubernetes.io/component: provider-kubernetes
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - persistentvolumeclaims
      - services
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["ray.io"]
    resources:
      - rayservices
      - rayservices/status
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: model-serving-provider-kubernetes
  namespace: model-serving
  labels:
    app.kubernetes.io/part-of: model-platform
    app.kubernetes.io/component: provider-kubernetes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: model-serving-provider-kubernetes
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
