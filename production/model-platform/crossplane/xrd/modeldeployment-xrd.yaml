apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: modeldeployments.platform.example.com
  labels:
    app.kubernetes.io/part-of: model-platform
    app.kubernetes.io/component: deployment-api
spec:
  scope: Namespaced
  defaultCompositionRef:
    name: modeldeployment-runtime-zero-v1alpha1
  defaultCompositionUpdatePolicy: Manual
  group: platform.example.com
  names:
    kind: ModelDeployment
    plural: modeldeployments
    singular: modeldeployment
    shortNames:
      - mdp
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - projectRef
                - modelVersionRef
                - runtimeProfileRef
                - desiredState
                - placement
                - access
              properties:
                projectRef:
                  type: string
                  enum:
                    - model-serving
                modelVersionRef:
                  type: string
                  enum:
                    - qwen3.6-27b-w8a8-20260806
                    - qwen3.8-27b-w8a8
                runtimeProfileRef:
                  type: string
                  enum:
                    - qwen36-w8a8-ascend-a3-v1
                    - qwen38-w8a8-ray-ascend-910b3-v1
                    - qwen38-w8a8-ray-ascend-910b3-tp2-v1
                desiredState:
                  type: string
                  enum:
                    - Stopped
                    - Running
                placement:
                  type: object
                  required:
                    - acceleratorPool
                  properties:
                    acceleratorPool:
                      type: string
                      enum:
                        - control-plane-only
                        - ascend-a3
                        - ascend-910b3
                    nodeSelector:
                      type: object
                      required:
                        - kubernetes.io/arch
                        - kubernetes.io/hostname
                        - node.kubernetes.io/npu.chip.name
                      properties:
                        accelerator-type:
                          type: string
                          enum:
                            - module-a3-16
                        kubernetes.io/arch:
                          type: string
                          const: arm64
                        kubernetes.io/hostname:
                          type: string
                          enum:
                            - gpu-server-00
                            - a3-server-00
                        node.kubernetes.io/npu.chip.name:
                          type: string
                          enum:
                            - 910B3
                            - Ascend910
                    staticDeviceAllocation:
                      type: string
                      description: >-
                        Optional Ascend device-plugin allocation list, for example
                        Ascend910-8,Ascend910-9. Use only when physical workloads
                        outside Kubernetes make automatic allocation unsafe.
                      pattern: "^Ascend910-([0-9]|1[0-5])(,Ascend910-([0-9]|1[0-5]))*$"
                access:
                  type: object
                  required:
                    - visibility
                  properties:
                    visibility:
                      type: string
                      enum:
                        - internal
                        - private
                artifact:
                  type: object
                  required:
                    - modelId
                    - revision
                    - repository
                    - path
                    - manifestDigest
                  properties:
                    modelId:
                      type: string
                      pattern: "^[^/\\s]+/[^/\\s]+$"
                    revision:
                      type: string
                      pattern: "^[0-9a-f]{8,64}$"
                    repository:
                      type: string
                      const: model-artifacts
                    path:
                      type: string
                      pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
                    manifestDigest:
                      type: string
                      pattern: "^sha256:[0-9a-f]{64}$"
                runtime:
                  type: object
                  required:
                    - image
                    - rayVersion
                    - modelPath
                    - modelName
                    - serveConfigV2
                    - headCPU
                    - headMemory
                    - workerCPU
                    - workerMemory
                    - npuPerWorker
                    - workerReplicas
                  properties:
                    image:
                      type: string
                      pattern: "^110\\.120\\.0\\.3:30670/container-images/.+@sha256:[0-9a-f]{64}$"
                    rayVersion:
                      type: string
                      pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
                    modelPath:
                      type: string
                      pattern: "^/models/[A-Za-z0-9._/-]+$"
                    modelName:
                      type: string
                      pattern: "^[a-z0-9][a-z0-9.-]*$"
                    serveConfigV2:
                      type: string
                      minLength: 1
                      maxLength: 20000
                    headCPU:
                      type: string
                      pattern: "^[0-9]+m?$"
                    headMemory:
                      type: string
                      pattern: "^[0-9]+(Mi|Gi)$"
                    workerCPU:
                      type: string
                      pattern: "^[0-9]+m?$"
                    workerMemory:
                      type: string
                      pattern: "^[0-9]+(Mi|Gi)$"
                    npuPerWorker:
                      type: integer
                      enum:
                        - 2
                        - 8
                    workerReplicas:
                      type: integer
                      enum:
                        - 0
                        - 1
                cache:
                  type: object
                  required:
                    - image
                    - baseURL
                    - readerSecret
                    - storageClassName
                    - size
                  properties:
                    image:
                      type: string
                      pattern: "^110\\.120\\.0\\.3:30670/container-images/.+@sha256:[0-9a-f]{64}$"
                    baseURL:
                      type: string
                      pattern: "^https?://[A-Za-z0-9.-]+(:[0-9]+)?$"
                    readerSecret:
                      type: string
                      const: artifact-keeper-model-runtime
                    storageClassName:
                      type: string
                      pattern: "^model-cache-[a-z0-9-]+$"
                    size:
                      type: string
                      pattern: "^[1-9][0-9]*(Gi|Ti)$"
                compositionRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      enum:
                        - modeldeployment-control-plane-v1alpha1
                        - modeldeployment-runtime-zero-v1alpha1
                        - modeldeployment-qwen38-ray-v1alpha1
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - AwaitingApproval
                    - PreparingCache
                    - Deploying
                    - Running
                    - Stopped
                    - Failed
                message:
                  type: string
                observedModelVersionRef:
                  type: string
                observedRuntimeProfileRef:
                  type: string
