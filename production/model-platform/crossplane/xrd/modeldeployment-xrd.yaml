apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: modeldeployments.platform.example.com
  labels:
    app.kubernetes.io/part-of: model-platform
    app.kubernetes.io/component: deployment-api
spec:
  scope: Namespaced
  defaultCompositionRef:
    name: modeldeployment-runtime-zero-v1alpha1
  enforcedCompositionRef:
    name: modeldeployment-runtime-zero-v1alpha1
  defaultCompositionUpdatePolicy: Manual
  group: platform.example.com
  names:
    kind: ModelDeployment
    plural: modeldeployments
    singular: modeldeployment
    shortNames:
      - mdp
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              additionalProperties: false
              required:
                - projectRef
                - modelVersionRef
                - runtimeProfileRef
                - desiredState
                - placement
                - access
              properties:
                projectRef:
                  type: string
                  enum:
                    - model-serving
                modelVersionRef:
                  type: string
                  enum:
                    - qwen3.6-27b-w8a8-20260806
                runtimeProfileRef:
                  type: string
                  enum:
                    - qwen36-w8a8-ascend-a3-v1
                desiredState:
                  type: string
                  enum:
                    - Stopped
                placement:
                  type: object
                  required:
                    - acceleratorPool
                  properties:
                    acceleratorPool:
                      type: string
                      enum:
                        - control-plane-only
                        - ascend-a3
                access:
                  type: object
                  required:
                    - visibility
                  properties:
                    visibility:
                      type: string
                      enum:
                        - internal
                        - private
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - AwaitingApproval
                    - PreparingCache
                    - Deploying
                    - Running
                    - Stopped
                    - Failed
                message:
                  type: string
                observedModelVersionRef:
                  type: string
                observedRuntimeProfileRef:
                  type: string
