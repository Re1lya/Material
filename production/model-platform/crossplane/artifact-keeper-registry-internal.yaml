apiVersion: v1
kind: Service
metadata:
  name: artifact-keeper-registry
  namespace: artifact-keeper
  labels:
    app.kubernetes.io/part-of: model-platform
    app.kubernetes.io/component: internal-registry-tls
spec:
  type: ExternalName
  externalName: traefik.kube-system.svc.cluster.local
  ports:
    - name: https
      port: 443
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: artifact-keeper-registry-internal
  namespace: artifact-keeper
  labels:
    app.kubernetes.io/part-of: model-platform
    app.kubernetes.io/component: internal-registry-tls
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - artifact-keeper-registry.artifact-keeper.svc.cluster.local
      secretName: artifact-keeper-registry-internal-tls
  rules:
    - host: artifact-keeper-registry.artifact-keeper.svc.cluster.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: artifact-keeper-backend
                port:
                  number: 8080
