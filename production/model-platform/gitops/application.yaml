apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-platform-bootstrap
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: model-platform
    app.kubernetes.io/managed-by: kubectl
spec:
  project: model-platform
  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/gitadmin/model-platform-config.git
    targetRevision: main
    path: environments/production/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: model-platform-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
