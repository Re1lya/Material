apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: k12-data-pipeline
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: model-platform
spec:
  description: Complete K12 data-pipeline CPU release; NPU profiles remain disabled.
  sourceRepos:
    - http://gitea-http.gitea.svc.cluster.local:3000/gitadmin/model-platform-config.git
  destinations:
    - namespace: k12
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: ray.io
      kind: RayCluster
  orphanedResources:
    warn: true
